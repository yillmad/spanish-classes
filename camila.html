<!DOCTYPE html>
<html lang="en" data-tz="America/Lima">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Classes with Camila - Availability</title>
  
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  
  <!-- Google Fonts & Stylesheet -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* Clean standalone styling for Camila */
    .brand-standalone {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-standalone .brand-icon-img {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
    }
    .brand-standalone .title-area h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }
    .brand-standalone .title-area span {
      font-size: 0.76rem;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- HEADER (Completely standalone, no links to other pages) -->
  <header>
    <div class="brand-standalone">
      <img src="images/icon-badge.png" alt="LetsLerni" class="brand-icon-img" onerror="this.style.display='none'" />
      <div class="title-area">
        <h1>Spanish with Camila</h1>
        <span>Teacher &amp; Tutor &bull; Live Availability</span>
      </div>
    </div>

    <div class="header-right">
      <div class="timezone-control">
        <label for="tz-select">Time Zone:</label>
        <select id="tz-select" class="timezone-select" onchange="changeTimezone(this.value)">
          <option value="America/Lima" selected>Peru (PET)</option>
          <option value="America/Los_Angeles">Washington State (USA - PT)</option>
          <option value="Europe/London">England (BST/GMT)</option>
          <option value="Europe/Rome">Italy (CEST/CET)</option>
        </select>
      </div>

      <div class="top-selection-badge" id="top-selection-badge">
        <span id="selected-count">0 selected</span>
        <button class="btn-top-continue" onclick="openBookingModal()">
          BOOK NOW &rarr;
        </button>
      </div>
    </div>
  </header>

  <!-- WEEK HEADER -->
  <div class="week-header-wrapper" id="week-header-wrapper">
    <div class="week-header" id="week-header"></div>
  </div>

  <!-- SCROLLABLE GRID -->
  <div class="calendar-scroll-area" id="scroll-area">
    <div class="grid-container">
      <div class="time-column" id="time-column"></div>
      <div class="days-grid" id="days-grid"></div>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Book Spanish Classes with Camila</h3>
      
      <div class="slots-summary">
        <strong>Selected Times:</strong>
        <ul id="selected-slots-list" style="padding-left: 18px; margin-top: 4px;"></ul>
      </div>

      <form id="booking-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label>Select Subject / Class Focus:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="class-option" value="Conversational Spanish" checked> Conversational Spanish</label>
            <label><input type="checkbox" name="class-option" value="AP Spanish / DELE / STAMP Exam Prep"> <strong>AP Spanish / DELE / STAMP Exam Prep</strong></label>
            <label><input type="checkbox" name="class-option" value="Grammar & Writing"> Grammar & Writing</label>
            <label><input type="checkbox" name="class-option" value="Homework / School Support"> Homework / School Support</label>
            <label><input type="checkbox" name="class-option" value="Spanish for Beginners"> Spanish for Beginners</label>
          </div>
        </div>

        <div class="form-group">
          <label for="student-name">Student's Name:</label>
          <input type="text" id="student-name" required placeholder="e.g., Alex Smith" />
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes (Optional):</label>
          <textarea id="notes" rows="2" placeholder="Any specific goals, topics, or requests..."></textarea>
        </div>

        <div class="send-options">
          <button type="button" class="btn-send btn-whatsapp" onclick="sendViaWhatsApp()">
            Send via WhatsApp
          </button>
          <button type="button" class="btn-send btn-gmail" onclick="sendViaGmail()">
            Send via Gmail
          </button>
        </div>

        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script src="js/camila-calendar.js"></script>
</body>
</html>
