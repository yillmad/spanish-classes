<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clases de Español con Yill - Disponibilidad</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">Y</div>
      <div class="title-area">
        <h1>Clases de Español</h1>
      </div>
    </div>

    <div class="header-right">
      <!-- LANGUAGE SWITCHER -->
      <div class="lang-switch" aria-label="Selector de idioma">
        <a href="index.html" class="lang-link" title="English">🇺🇸 EN</a>
        <span class="lang-divider">|</span>
        <span class="lang-link active" title="Español">🇪🇸 ES</span>
      </div>

      <div class="timezone-control">
        <label for="tz-select">Zona horaria:</label>
        <select id="tz-select" class="timezone-select" onchange="changeTimezone(this.value)">
          <option value="America/Los_Angeles" selected>Washington (EE. UU. - PT)</option>
          <option value="America/Lima">Perú (PET)</option>
          <option value="Europe/London">Inglaterra (BST/GMT)</option>
          <option value="Europe/Rome">Italia (CEST/CET)</option>
        </select>
      </div>

      <div class="top-selection-badge" id="top-selection-badge">
        <span id="selected-count">0 seleccionados</span>
        <button class="btn-top-continue" onclick="openBookingModal()">
          RESERVAR AHORA &rarr;
        </button>
      </div>
    </div>
  </header>

  <!-- WEEK HEADER -->
  <div class="week-header-wrapper" id="week-header-wrapper">
    <div class="week-header" id="week-header"></div>
  </div>

  <!-- SCROLLABLE GRID -->
  <div class="calendar-scroll-area" id="scroll-area">
    <div class="grid-container">
      <div class="time-column" id="time-column"></div>
      <div class="days-grid" id="days-grid"></div>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Reservar Clases de Español</h3>
      
      <div class="slots-summary">
        <strong>Horarios seleccionados:</strong>
        <ul id="selected-slots-list" style="padding-left: 18px; margin-top: 4px;"></ul>
      </div>

      <form id="booking-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label>Selecciona el enfoque de la clase:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="class-option" value="Español conversacional" checked> Español conversacional</label>
            <label><input type="checkbox" name="class-option" value="Gramática y redacción"> Gramática y redacción</label>
            <label><input type="checkbox" name="class-option" value="Apoyo escolar / Tareas"> Apoyo escolar / Tareas</label>
            <label><input type="checkbox" name="class-option" value="Español para principiantes"> Español para principiantes</label>
          </div>
        </div>

        <div class="form-group">
          <label for="student-name">Nombre del estudiante:</label>
          <input type="text" id="student-name" required placeholder="Ej. Alex Smith" />
        </div>

        <div class="form-group">
          <label for="notes">Notas adicionales (opcional):</label>
          <textarea id="notes" rows="2" placeholder="Temas específicos o solicitudes..."></textarea>
        </div>

        <div class="send-options">
          <button type="button" class="btn-send btn-whatsapp" onclick="sendViaWhatsApp()">
            Enviar por WhatsApp
          </button>
          <button type="button" class="btn-send btn-gmail" onclick="sendViaGmail()">
            Enviar por Gmail
          </button>
        </div>

        <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="js/calendar.js"></script>
</body>
</html>
