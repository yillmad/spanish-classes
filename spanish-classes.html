<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Classes with Yill - Availability</title>
  <style>
    :root {
      --google-blue: #1a73e8;
      --google-blue-hover: #1557b0;
      --google-bg: #f8f9fa;
      --card-bg: #ffffff;
      --google-border: #dadce0;
      --google-text: #3c4043;
      --google-subtext: #70757a;
      
      /* Available slots */
      --slot-available-bg: #e8f0fe;
      --slot-available-border: #1a73e8;
      --slot-available-text: #1967d2;

      /* Selected slots */
      --slot-selected-bg: #e6f4ea;
      --slot-selected-border: #137333;
      --slot-selected-text: #137333;

      --whatsapp-green: #25d366;
      --whatsapp-hover: #1ebd56;

      --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--google-bg);
      color: var(--google-text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--google-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--google-blue);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
    }

    .title-area h1 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--google-text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .timezone-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timezone-control label {
      font-size: 0.75rem;
      color: var(--google-subtext);
      font-weight: 500;
    }

    .timezone-select {
      padding: 6px 8px;
      border: 1px solid var(--google-border);
      border-radius: 4px;
      background: white;
      color: var(--google-text);
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    /* ACTION BADGE */
    .top-selection-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: #e6f4ea;
      border: 1px solid #ceead6;
      padding: 4px 6px 4px 12px;
      border-radius: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .top-selection-badge span {
      font-size: 0.82rem;
      font-weight: 700;
      color: #137333;
      white-space: nowrap;
    }

    .btn-top-continue {
      background: linear-gradient(135deg, #1e8e3e, #137333);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(19, 115, 51, 0.35);
      transition: all 0.2s ease-in-out;
      animation: pulse-glow 2s infinite;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-top-continue:hover {
      background: linear-gradient(135deg, #1b8037, #0d5c27);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(19, 115, 51, 0.45);
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 142, 62, 0.6);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(30, 142, 62, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(30, 142, 62, 0);
      }
    }

    /* FIXED WEEK HEADER */
    .week-header-wrapper {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--google-border);
      padding-left: 62px;
      overflow-x: hidden;
    }

    .week-header {
      display: grid;
      grid-template-columns: repeat(7, minmax(75px, 1fr));
      width: 100%;
      min-width: 525px;
      padding: 8px 0;
    }

    .day-col-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-name {
      font-size: 0.75rem;
      color: var(--google-subtext);
      text-transform: lowercase;
      font-weight: 500;
    }

    .day-number {
      font-size: 1.1rem;
      font-weight: 500;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--google-text);
    }

    .day-col-header.is-today .day-name {
      color: var(--google-blue);
      font-weight: 700;
    }

    .day-col-header.is-today .day-number {
      background-color: var(--google-blue);
      color: white;
      font-weight: 600;
    }

    /* SCROLLABLE GRID AREA */
    .calendar-scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
      background: var(--card-bg);
    }

    .grid-container {
      display: flex;
      min-width: 587px;
      position: relative;
      padding-bottom: 80px;
    }

    /* TIME COLUMN (STICKY) */
    .time-column {
      width: 62px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      position: sticky;
      left: 0;
      z-index: 15;
      border-right: 1px solid var(--google-border);
    }

    .time-slot-label {
      height: 60px;
      font-size: 0.7rem;
      color: var(--google-subtext);
      text-align: right;
      padding-right: 8px;
      transform: translateY(-8px);
      background: var(--card-bg);
      white-space: nowrap;
    }

    /* DAYS GRID */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(75px, 1fr));
      flex: 1;
    }

    .day-column {
      border-right: 1px solid var(--google-border);
      position: relative;
    }

    .hour-cell {
      height: 60px;
      border-bottom: 1px solid var(--google-border);
    }

    /* CURRENT TIME LINE */
    .current-time-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--google-blue);
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .current-time-line::before {
      content: '';
      width: 8px;
      height: 8px;
      background-color: var(--google-blue);
      border-radius: 50%;
      position: absolute;
      left: -4px;
    }

    /* EVENT CHIPS */
    .event-chip {
      position: absolute;
      left: 3px;
      right: 3px;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 0.68rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      z-index: 5;
      user-select: none;
      background-color: var(--slot-available-bg);
      border-left: 3px solid var(--slot-available-border);
      color: var(--slot-available-text);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .event-chip.selected {
      background-color: var(--slot-selected-bg) !important;
      border-left: 3px solid var(--slot-selected-border) !important;
      color: var(--slot-selected-text) !important;
      font-weight: 700;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(32, 33, 36, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.15rem;
      color: var(--google-text);
      margin-bottom: 8px;
    }

    .slots-summary {
      background: #f1f3f4;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--google-text);
      margin-bottom: 16px;
      max-height: 100px;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--google-text);
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }

    .form-group input[type="text"], .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--google-border);
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .send-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-send {
      width: 100%;
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-whatsapp {
      background-color: var(--whatsapp-green);
      color: white;
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
    }

    .btn-gmail {
      background-color: #ea4335;
      color: white;
    }

    .btn-gmail:hover {
      background-color: #d93025;
    }

    .btn-cancel {
      background: transparent;
      border: none;
      color: var(--google-subtext);
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">Y</div>
      <div class="title-area">
        <h1>Spanish Classes</h1>
      </div>
    </div>

    <div class="header-right">
      <div class="timezone-control">
        <label for="tz-select">Time Zone:</label>
        <select id="tz-select" class="timezone-select" onchange="changeTimezone(this.value)">
          <option value="America/Los_Angeles" selected>Washington State (USA - PT)</option>
          <option value="America/Lima">Peru (PET)</option>
          <option value="Europe/London">England (BST/GMT)</option>
          <option value="Europe/Rome">Italy (CEST/CET)</option>
        </select>
      </div>

      <div class="top-selection-badge" id="top-selection-badge">
        <span id="selected-count">0 selected</span>
        <button class="btn-top-continue" onclick="openBookingModal()">
          BOOK NOW &rarr;
        </button>
      </div>
    </div>
  </header>

  <!-- WEEK HEADER -->
  <div class="week-header-wrapper" id="week-header-wrapper">
    <div class="week-header" id="week-header"></div>
  </div>

  <!-- SCROLLABLE GRID -->
  <div class="calendar-scroll-area" id="scroll-area">
    <div class="grid-container">
      <div class="time-column" id="time-column"></div>
      <div class="days-grid" id="days-grid"></div>
    </div>
  </div>

  <!-- BOOKING MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Book Spanish Classes</h3>
      
      <div class="slots-summary">
        <strong>Selected Times:</strong>
        <ul id="selected-slots-list" style="padding-left: 18px; margin-top: 4px;"></ul>
      </div>

      <form id="booking-form">
        <div class="form-group">
          <label>Select Subject / Class Focus:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="class-option" value="Conversational Spanish" checked> Conversational Spanish</label>
            <label><input type="checkbox" name="class-option" value="Grammar & Writing"> Grammar & Writing</label>
            <label><input type="checkbox" name="class-option" value="Homework / School Support"> Homework / School Support</label>
            <label><input type="checkbox" name="class-option" value="Spanish for Beginners"> Spanish for Beginners</label>
          </div>
        </div>

        <div class="form-group">
          <label for="student-name">Student's Name:</label>
          <input type="text" id="student-name" required placeholder="e.g., Alex Smith" />
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes (Optional):</label>
          <textarea id="notes" rows="2" placeholder="Any specific topics or requests..."></textarea>
        </div>

        <div class="send-options">
          <button type="button" class="btn-send btn-whatsapp" onclick="sendViaWhatsApp()">
            Send via WhatsApp
          </button>
          <button type="button" class="btn-send btn-gmail" onclick="sendViaGmail()">
            Send via Gmail
          </button>
        </div>

        <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    const weekDays = [
      { name: 'lun', date: 20, full: 'Monday 20' },
      { name: 'mar', date: 21, full: 'Tuesday 21' },
      { name: 'mié', date: 22, full: 'Wednesday 22', isToday: true },
      { name: 'jue', date: 23, full: 'Thursday 23' },
      { name: 'vie', date: 24, full: 'Friday 24' },
      { name: 'sáb', date: 25, full: 'Saturday 25' },
      { name: 'dom', date: 26, full: 'Sunday 26' }
    ];

    const displayHours24 = Array.from({ length: 24 }, (_, i) => i);

    const timezoneOffsets = {
      'America/Los_Angeles': 0, // Main View: Washington State (PT)
      'America/Lima': 2,        // Peru (PET) -> +2 hours relative to WA
      'Europe/London': 8,       // England -> +8 hours
      'Europe/Rome': 9          // Italy -> +9 hours
    };

    let currentTz = 'America/Los_Angeles';

    // UPDATED 30-MINUTE SLOTS (WA TIME) - 10:00 PM REMOVED
    const baseAvailableSlots = [
      // Lunes (idx 0)
      { dayIdx: 0, hours: [6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 17.0, 17.5, 18.0, 18.5, 20.0, 20.5, 21.0, 21.5] },

      // Martes (idx 1)
      { dayIdx: 1, hours: [6.0, 6.5, 7.0, 7.5, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 17.0, 17.5, 18.0, 18.5, 19.0, 20.5, 21.0, 21.5] },

      // Miércoles (idx 2)
      { dayIdx: 2, hours: [6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 14.0, 14.5, 15.0, 15.5, 17.0, 17.5, 18.0, 20.5, 21.0, 21.5] },

      // Jueves (idx 3)
      { dayIdx: 3, hours: [6.0, 6.5, 7.0, 7.5, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 17.0, 17.5, 18.5, 19.0, 19.5, 20.0, 20.5, 21.0, 21.5] },

      // Viernes (idx 4)
      { dayIdx: 4, hours: [6.0, 6.5, 7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 17.0, 17.5, 18.0, 18.5, 19.0, 19.5, 20.0, 20.5, 21.0, 21.5] },

      // Sábado (idx 5)
      { dayIdx: 5, hours: [6.0, 6.5, 7.0, 7.5, 8.0, 9.5, 10.0, 11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5, 15.0, 15.5, 16.0, 16.5, 17.0, 17.5, 18.0, 18.5, 19.0, 19.5, 20.0, 20.5, 21.0, 21.5] },

      // Domingo (idx 6)
      { dayIdx: 6, hours: [] }
    ];

    // SMART GROUPING: MERGES ADJACENT 30-MIN SLOTS INTO 1-HOUR BLOCKS WHENEVER POSSIBLE
    function groupSlotsIntoBlocks() {
      const groupedEvents = [];
      let eventId = 1;

      baseAvailableSlots.forEach(dayData => {
        const sortedHours = [...dayData.hours].sort((a, b) => a - b);
        let i = 0;

        while (i < sortedHours.length) {
          const current = sortedHours[i];
          const next = sortedHours[i + 1];

          if (current % 1 === 0 && next === current + 0.5) {
            groupedEvents.push({
              id: `block-${eventId++}`,
              dayIdx: dayData.dayIdx,
              startHour: current,
              durationHours: 1.0,
              title: 'Available'
            });
            i += 2;
          } else {
            groupedEvents.push({
              id: `block-${eventId++}`,
              dayIdx: dayData.dayIdx,
              startHour: current,
              durationHours: 0.5,
              title: 'Available'
            });
            i += 1;
          }
        }
      });

      return groupedEvents;
    }

    const baseEvents = groupSlotsIntoBlocks();
    let selectedSlots = [];

    function formatHourGoogle(hour24) {
      if (hour24 === 0) return '';
      const period = hour24 >= 12 ? 'p.m.' : 'a.m.';
      const h = hour24 % 12 === 0 ? 12 : hour24 % 12;
      return `${h} ${period}`;
    }

    function formatTimeLabel(floatHour24) {
      const h = Math.floor(floatHour24) % 24;
      const mins = Math.round((floatHour24 % 1) * 60);
      const period = h >= 12 ? 'p.m.' : 'a.m.';
      const displayHour = h % 12 === 0 ? 12 : h % 12;
      const displayMins = mins === 0 ? ':00' : `:${mins < 10 ? '0' : ''}${mins}`;
      return `${displayHour}${displayMins} ${period}`;
    }

    function renderCalendar() {
      // 1. Render Header
      const headerContainer = document.getElementById('week-header');
      headerContainer.innerHTML = '';
      weekDays.forEach(day => {
        const dayEl = document.createElement('div');
        dayEl.className = `day-col-header ${day.isToday ? 'is-today' : ''}`;
        dayEl.innerHTML = `
          <span class="day-name">${day.name}</span>
          <span class="day-number">${day.date}</span>
        `;
        headerContainer.appendChild(dayEl);
      });

      // 2. Render Time Column
      const timeColumn = document.getElementById('time-column');
      timeColumn.innerHTML = '';
      displayHours24.forEach(hour24 => {
        const timeLabel = document.createElement('div');
        timeLabel.className = 'time-slot-label';
        timeLabel.innerText = formatHourGoogle(hour24);
        timeColumn.appendChild(timeLabel);
      });

      // 3. Render Grid
      const daysGrid = document.getElementById('days-grid');
      daysGrid.innerHTML = '';

      weekDays.forEach((day) => {
        const dayCol = document.createElement('div');
        dayCol.className = 'day-column';

        displayHours24.forEach(() => {
          const cell = document.createElement('div');
          cell.className = 'hour-cell';
          dayCol.appendChild(cell);
        });

        if (day.isToday) {
          const timeLine = document.createElement('div');
          timeLine.className = 'current-time-line';
          timeLine.style.top = `${18 * 60 + 30}px`;
          dayCol.appendChild(timeLine);
        }

        daysGrid.appendChild(dayCol);
      });

      // 4. Render Event Chips
      const offset = timezoneOffsets[currentTz];

      baseEvents.forEach(evt => {
        let adjustedHour = evt.startHour + offset;
        let dayShift = Math.floor(adjustedHour / 24);
        let finalHour = (adjustedHour % 24 + 24) % 24;
        let targetDayIdx = evt.dayIdx + dayShift;

        if (targetDayIdx >= 0 && targetDayIdx < weekDays.length) {
          const dayCol = daysGrid.children[targetDayIdx];
          if (dayCol) {
            const chip = document.createElement('div');
            const slotKey = `${evt.id}-${targetDayIdx}`;
            const isSelected = selectedSlots.some(s => s.slotKey === slotKey);
            
            const topPx = finalHour * 60 + 1;
            const heightPx = evt.durationHours * 60 - 2;
            const timeRangeText = `${formatTimeLabel(finalHour)} - ${formatTimeLabel(finalHour + evt.durationHours)}`;

            chip.className = `event-chip ${isSelected ? 'selected' : ''}`;
            chip.innerText = isSelected ? '✓ Selected' : (evt.durationHours === 0.5 ? formatTimeLabel(finalHour) : 'Available');
            chip.title = timeRangeText;
            chip.style.top = `${topPx}px`;
            chip.style.height = `${heightPx}px`;

            chip.onclick = (e) => {
              e.stopPropagation();
              toggleSlotSelection(slotKey, weekDays[targetDayIdx].full, timeRangeText);
            };

            dayCol.appendChild(chip);
          }
        }
      });
    }

    function toggleSlotSelection(slotKey, dayText, timeText) {
      const existingIdx = selectedSlots.findIndex(s => s.slotKey === slotKey);
      
      if (existingIdx > -1) {
        selectedSlots.splice(existingIdx, 1);
      } else {
        selectedSlots.push({
          slotKey: slotKey,
          dayText: dayText,
          timeText: timeText
        });
      }

      updateTopBadge();
      renderCalendar();
    }

    function updateTopBadge() {
      const badge = document.getElementById('top-selection-badge');
      const countText = document.getElementById('selected-count');

      if (selectedSlots.length > 0) {
        badge.style.display = 'flex';
        countText.innerText = `${selectedSlots.length} slot${selectedSlots.length > 1 ? 's' : ''} selected`;
      } else {
        badge.style.display = 'none';
      }
    }

    function changeTimezone(newTz) {
      currentTz = newTz;
      renderCalendar();
    }

    function openBookingModal() {
      const listContainer = document.getElementById('selected-slots-list');
      const tzSelect = document.getElementById('tz-select');
      const tzName = tzSelect.options[tzSelect.selectedIndex].text;

      listContainer.innerHTML = '';
      selectedSlots.forEach(s => {
        const li = document.createElement('li');
        li.innerText = `${s.dayText} at ${s.timeText} (${tzName})`;
        listContainer.appendChild(li);
      });

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    function buildMessageData() {
      const studentName = document.getElementById('student-name').value.trim() || 'Student';
      const notes = document.getElementById('notes').value.trim();
      
      const selectedOptions = Array.from(document.querySelectorAll('input[name="class-option"]:checked'))
        .map(cb => cb.value);

      const tzSelect = document.getElementById('tz-select');
      const tzName = tzSelect.options[tzSelect.selectedIndex].text;

      const timeList = selectedSlots.map(s => `• ${s.dayText} at ${s.timeText} (${tzName})`).join('\n');
      const subjectList = selectedOptions.length > 0 ? selectedOptions.join(', ') : 'Spanish Classes';

      let message = `Hi Yill, I would like to book these times for Spanish classes:\n\n${timeList}\n\n`;
      message += `Class Focus: ${subjectList}\n`;
      message += `Student Name: ${studentName}\n`;
      if (notes) {
        message += `Notes: ${notes}\n`;
      }

      return { message, studentName };
    }

    function sendViaWhatsApp() {
      if (selectedSlots.length === 0) return;
      const { message } = buildMessageData();
      const phoneNumber = '51952401591';
      const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }

    function sendViaGmail() {
      if (selectedSlots.length === 0) return;
      const { message, studentName } = buildMessageData();
      const recipient = 'yill.salvatore@gmail.com';
      const subject = `Spanish Class Booking Request - ${studentName}`;
      
      const mailtoUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${recipient}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
      window.open(mailtoUrl, '_blank');
    }

    // Horizontal Scroll Sync
    const scrollArea = document.getElementById('scroll-area');
    const headerWrapper = document.getElementById('week-header-wrapper');

    scrollArea.addEventListener('scroll', () => {
      headerWrapper.scrollLeft = scrollArea.scrollLeft;
    });

    window.onload = () => {
      renderCalendar();
      setTimeout(() => {
        document.getElementById('scroll-area').scrollTop = 360;
      }, 100);
    };
  </script>
</body>
</html>
